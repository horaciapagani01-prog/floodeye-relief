<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloodRelief - AI Audit Portal</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            padding: 40px 20px; 
            background: #f0f2f5; 
            color: #333;
        }
        .container { 
            max-width: 600px; 
            margin: auto; 
            background: #ffffff; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        }
        h2 { color: #1a1a1a; margin-top: 0; }
        .badge { 
            background: #e2f0d9; 
            border-left: 4px solid #385723; 
            color: #274e13; 
            padding: 12px; 
            margin-bottom: 20px; 
            border-radius: 4px; 
            font-size: 0.9em; 
        }
        .zone-box { 
            border: 1px solid #e1e4e8; 
            padding: 24px; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            background: #fafbfc; 
        }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95em; color: #444; }
        input, button { display: block; margin-bottom: 18px; padding: 12px; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #ccc; font-size: 1em; }
        input:focus { border-color: #007bff; outline: none; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0056b3; }
        .admin-link { text-align: center; margin-top: 20px; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌊 Flood Relief Proof Verification</h2>
        <p>Submit your NGO expenditure proof for instant Claude AI compliance auditing.</p>
        
        <div class="badge">
            🔒 <strong>Secure AI Portal:</strong> Uploaded receipts are analyzed instantly for fraud detection and validity.
        </div>
        
        <div class="zone-box">
            <h3 style="margin-top:0; color:#007bff;">Zone A Relief Fund</h3>
            <form action="/submit-proof" method="post" enctype="multipart/form-data">
                <input type="hidden" name="zone_id" value="Zone A">
                
                <label>NGO Name:</label>
                <input type="text" name="ngo_name" required placeholder="e.g., Red Cross Relief">
                
                <label>Claimed Amount ($):</label>
                <input type="number" step="0.01" name="amount" required placeholder="150.00">
                
                <label>Description / Note:</label>
                <input type="text" name="note" required placeholder="Purchased 50 emergency food kits">
                
                <label>Proof Image (Receipt / Photo):</label>
                <input type="file" name="proof_image" accept="image/*" required>
                
                <button type="submit">Submit Proof for AI Audit</button>
            </form>
        </div>
        
        <div class="admin-link">
            <a href="/admin">👉 Go to Admin Dashboard & AI Audits</a>
        </div>
    </div>
</body>
</html>
